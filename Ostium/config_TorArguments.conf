// =============================================================================================================
//	To function, you need to install tor-expert-bundle currently, it is not included in the release, so you 
//	will need to obtain it yourself.
//	If you use this feature, please use it responsibly.
//
//  To enable Tor mode (experimental), create a file named .tor in the application root directory.        
//  Important! Even with a solid set of flags, WebView2 is not "Tor Browser" the current Tor
//  implementation is experimental, and WebView2 is not an isolated browser environment like Tor Browser.
//	Rename this config_TorArguments.conf file to TorArguments.conf
//
//	Warning! Microsoft announcement. Apps in production shouldn\t use WebView2 browser flags, because these 
//	flags might be removed or altered at any time, and aren\t necessarily supported long-term.
//	https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/webview-features-flags
//
//  Feature flags defined in Chromium : https://peter.sh/experiments/chromium-command-line-switches/
// =============================================================================================================

// ============================================================
// OSTIUM - TOR ARGUMENTS
// Chromium / WebView2 configuration
//
// Lines beginning with // are comments.
// Lines beginning with # are disabled arguments.
// Remove # to enable a disabled argument.
// One argument per line.
// ============================================================


// ============================================================
//  Proxy / Tor network
// ============================================================

//  Uses a specified proxy server, overrides system settings. 
//  This switch only affects HTTP and HTTPS requests.

--proxy-server=socks5://127.0.0.1:9050

//  Specifies a list of hosts for whom we bypass proxy settings 
//  and use direct connections. Ignored if --proxy-auto-detect 
//  or --no-proxy-server are also specified.

--proxy-bypass-list=localhost;127.0.0.1;::1


// ============================================================
//  DNS Resolution
// ============================================================

// Prevent Chromium from resolving non-local hostnames
// through the system DNS resolver.
// These mappings only apply to the host resolver.

--host-resolver-rules="MAP * ~NOTFOUND , EXCLUDE localhost, EXCLUDE 127.0.0.1, EXCLUDE ::1"
--dns-prefetch-disable


// ============================================================
//  Network / DNS / prediction features
// ============================================================

// Comma-separated list of feature names to disable.

--disable-features=DnsOverHttps,NetworkPrediction,MediaRouter,OptimizationHints,Translate,AudioServiceOutOfProcess,PasswordManagerOnboarding,InterestFeedContentSuggestions
--disable-quic


// ============================================================
//  WebRTC
// ============================================================

//  Override WebRTC IP handling policy to mimic the behavior 
//  when WebRTC IP handling policy is specified in Preferences.

--force-webrtc-ip-handling-policy=disable_non_proxied_udp


// ============================================================
//  Background networking / extraneous services
// ============================================================

//  Disable several subsystems which run network requests in the background.
--disable-background-networking

--disable-background-media

//  Prevent renderer process backgrounding when set.
--disable-renderer-backgrounding

--disable-background-mode

//  Disables the optimizations flags in Commit requests for sync invalidations. 
--disable-sync

//  Disables Domain Reliability Monitoring.
--disable-domain-reliability

//  Disables the crash reporting.
--disable-breakpad

//  Disable crash reporter for headless. 
--disable-crash-reporter

--disable-metrics
#--disable-component-update

// Don\t send hyperlink auditing pings
--no-pings

//  Skip First Run tasks as well as not showing additional dialogs, prompts or bubbles.
--no-first-run

// 	Disables the default browser check.
--no-default-browser-check


// ============================================================
//  Reducing the browsers attack surface
// ============================================================

--disable-extensions
--disable-plugins
--disable-popup-blocking
--disable-infobars


// ============================================================
//  Process reduction / stability
// ============================================================

//  Overrides the default/calculated limit to the number of renderer processes.
--renderer-process-limit=1


// ============================================================
// OPTIONAL ARGUMENTS
// Add # at the beginning to disable an argument.
// ============================================================

// #--disable-gpu
// #--disable-accelerated-video-decode
